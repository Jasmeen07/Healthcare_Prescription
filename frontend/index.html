<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthcare Prescription Interaction Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#4ade80"/><path d="M16 8v16M8 16h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
      <span class="sidebar-title">MedCheck</span>
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-page="home" href="#">
        <span class="nav-icon">⌂</span><span class="nav-label">Home</span>

      <a class="nav-item" data-page="patients" href="#">
        <span class="nav-icon">👤</span><span class="nav-label">Patient Dashboard</span>

      <a class="nav-item" data-page="alerts" href="#">
        <span class="nav-icon">🔔</span><span class="nav-label">Interaction Alerts</span>

      <a class="nav-item" data-page="analytics" href="#">
        <span class="nav-icon">📊</span><span class="nav-label">Analytics</span>

      <a class="nav-item" data-page="new-prescription" href="#">
        <span class="nav-icon">✚</span><span class="nav-label">New Prescription</span>
      </a>
      <a class="nav-item" data-page="drug-checker" href="#">
        <span class="nav-icon">💊</span><span class="nav-label">Drug Interaction Checker</span>
      </a>
      <div class="nav-divider"></div>
      <a class="nav-item" data-page="doctors" href="#">
        <span class="nav-icon">🩺</span><span class="nav-label">Doctors</span>
      </a>
      <a class="nav-item" data-page="medicines" href="#">
        <span class="nav-icon">🧪</span><span class="nav-label">Medicines</span>
      </a>
      <a class="nav-item" data-page="interactions-db" href="#">

      </a>
    </nav>

  <!-- MAIN CONTENT -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="topbarTitle">Healthcare Prescription Interaction Checker</span>
      </div>
      <div class="topbar-right">
        <div class="user-pill">
          <span class="user-icon">👩‍⚕️</span>
          <span>jkaur11_be24@thapar.edu</span>
        </div>
      </div>
    </header>

    <main class="content" id="content">
      <!-- Pages render here -->
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/patients.js"></script>
  <script src="js/pages/prescriptions.js"></script>
  <script src="js/pages/alerts.js"></script>

  <script src="js/pages/new-prescription.js"></script>
  <script src="js/pages/drug-checker.js"></script>
  <script src="js/pages/doctors.js"></script>
  <script src="js/pages/medicines.js"></script>
